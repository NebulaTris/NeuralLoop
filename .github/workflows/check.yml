name: Check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Set up (like `make setup`)
        run: cd pipeline && python -m pip install -e ".[dev]" playwright && python -m playwright install --with-deps chromium
      - name: Pip's generated files are up to date
        run: |
          python design/pip/generate_pip.py
          git diff --exit-code
      - run: make check

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cd apple && swift test
      - name: Build the Mac app
        run: |
          brew install xcodegen
          cd apple && xcodegen generate && xcodebuild -project NeuralLoop.xcodeproj -scheme NeuralLoop \
            -configuration Debug CODE_SIGN_IDENTITY=- build
      - name: Build the iPad app
        run: |
          cd apple && xcodebuild -project NeuralLoop.xcodeproj -scheme NeuralLoopPad -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
