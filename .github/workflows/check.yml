name: Check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: make setup
      - run: make check

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cd apple && swift test
