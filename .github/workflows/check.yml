name: Check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Set up (`make setup`, with the hash-locked dev tools from scripts/dev-requirements.txt)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          make setup PY=python PLAYWRIGHT_FLAGS=--with-deps
      - name: Pip's generated files are up to date
        run: |
          python design/pip/generate_pip.py
          # Modified, deleted, and untracked files all count (git diff alone misses a new PNG nobody added).
          changed="$(git status --porcelain -- apple/App/Resources pipeline/neuralloop_books/assets)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Pip's artwork is stale: run 'make pip' and commit everything it writes."
            exit 1
          fi
      - name: A full redraw of Pip gives every layer, at the right size
        # Chromium on Linux doesn't encode PNGs byte for byte like a Mac, so only presence, sizes, and art hashes
        # are compared; the committed PNGs are put back afterwards.
        run: |
          python design/pip/generate_pip.py --force
          python design/pip/generate_pip.py --check
          git checkout -- apple/App/Resources/PipLayers
      - run: make check PY=python

  swift:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: cd apple && swift test
      - name: Install XcodeGen (pinned release, checked by SHA-256)
        # To update: take the new release's xcodegen.zip digest (gh release view <version> -R yonaskolb/XcodeGen --json assets).
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          got="$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)"
          if [ "$got" != "Version: $XCODEGEN_VERSION" ]; then
            echo "::error::Expected XcodeGen $XCODEGEN_VERSION, got '$got'."
            exit 1
          fi
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the Mac app
        run: |
          cd apple && xcodegen generate && xcodebuild -project NeuralLoop.xcodeproj -scheme NeuralLoop \
            -configuration Debug CODE_SIGN_IDENTITY=- build
      - name: Build the iPad app
        run: |
          cd apple && xcodebuild -project NeuralLoop.xcodeproj -scheme NeuralLoopPad -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
