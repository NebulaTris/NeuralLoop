name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The pipeline's tests on Windows (the book lock, process trees, paths and encodings differ there).
# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
jobs:
  pipeline:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install the hash-locked dev tools and the pipeline (like make setup)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scripts/dev-requirements.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e pipeline
      - name: Pipeline tests, on Windows
        run: |
          cd pipeline
          python -X faulthandler -m pytest -q -p no:cacheprovider
