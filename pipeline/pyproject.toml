[project]
name = "neuralloop-books-pipeline"
version = "0.2.2"
description = "Turn a PDF or EPUB into learning loops, made with any AI model (or NotebookLM)"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.8"]
openai = ["openai>=3"]              # also OpenRouter; Ollama and opencode need no Python package
rumik = ["mlx-audio", "numpy"]      # Rumik OSS-1 speech on Apple silicon (CC-BY-NC 4.0)
notebooklm = ["notebooklm-py>=0.8.5"]
video = ["av>=18", "playwright>=1.50"]  # explainer videos: an animated scene rendered frame by frame
all = ["neuralloop-books-pipeline[anthropic,openai,rumik,notebooklm,video]"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.8", "openai>=3", "av>=18"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuralloop_books*"]

[tool.setuptools.package-data]
neuralloop_books = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"neuralloop_books/prompts.py" = ["E501"]   # prompt text is sent verbatim
"neuralloop_books/video.py" = ["E501"]     # the scene's HTML, CSS, and JavaScript template
"nl_book.py" = ["UP036", "UP031", "E402"]  # friendly message for Python < 3.10 must run before imports
